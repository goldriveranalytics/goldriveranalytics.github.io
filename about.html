<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Gold River Analytics</title>
    <meta name="description" content="Learn about Gold River Analytics.">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lora', 'Times New Roman', serif;
            line-height: 1.7;
            color: #404040;
            background-color: #FAFAFA;
        }
        
        .container {
            max-width: 1170px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        .navbar {
            background-color: #F5F5F5;
            border-bottom: 1px solid #EAEAEA;
            padding: 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 0 5px rgba(0,0,0,.1);
        }
        
        .navbar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #404040;
        }
        
        .logo {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border-radius: 8px;
            object-fit: contain;
        }
        
        .site-title {
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #404040;
            letter-spacing: -1px;
        }
        
        .navbar-nav {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .navbar-nav li {
            margin-left: 15px;
        }
        
        .navbar-nav a {
            color: #404040;
            text-decoration: none;
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 18px;
            font-weight: 300;
            padding: 12px 15px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        
        .navbar-nav a:hover,
        .navbar-nav a.active {
            background-color: #EAEAEA;
        }
        
        /* Page Header */
        .page-header {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><rect fill="%23667eea" width="1200" height="400"/><polygon fill="%23764ba2" points="0,400 1200,300 1200,400"/></svg>');
            background-size: cover;
            background-position: center;
            margin-top: 80px;
            padding: 100px 0;
            color: white;
            text-align: center;
        }
        
        .page-header h1 {
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        
        .page-header p {
            font-size: 20px;
            opacity: 0.9;
        }
        
        /* Main Content */
        .main-content {
            padding: 80px 0;
            background-color: white;
            min-height: 500px;
        }
        
        .content-placeholder {
            text-align: center;
            padding: 100px 0;
            color: #888;
            font-style: italic;
        }
        
        /* Footer */
        .footer {
            background-color: #404040;
            color: white;
            text-align: center;
            padding: 50px 0;
            margin-top: 80px;
        }
        
        .footer p {
            font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 16px;
            margin: 0;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar-header {
                flex-direction: column;
                gap: 20px;
            }
            
            .navbar-nav {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .navbar-nav li {
                margin: 5px;
            }
            
            .page-header h1 {
                font-size: 36px;
            }
        }
        
        .navbar-brand:hover {
            text-decoration: none;
            color: #F4B942;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="index.html">
                    <img src="GRA_logo.png" alt="Gold River Analytics Logo" class="logo">
                    <span class="site-title">Gold River Analytics</span>
                </a>
                <ul class="navbar-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="about.html" class="active">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1>About Us</h1>
            <p>Learn more about Gold River Analytics</p>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <div class="content-placeholder">
                <p>About page content will be added here...</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Gold River Analytics. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
